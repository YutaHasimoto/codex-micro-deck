<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="960" viewBox="0 0 1920 960" fill="none">
  <defs>
    <clipPath id="photo-frame">
      <rect width="1260" height="960"/>
    </clipPath>
    <linearGradient id="panel-glow" x1="1260" y1="0" x2="1920" y2="960" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111827"/>
      <stop offset="1" stop-color="#080B11"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#photo-frame)">
    <rect width="1260" height="960" fill="#0B0E14"/>
    <image href="../evidence/real-stream-deck-plus-scrubbed.jpg" x="150" y="0" width="960" height="960" preserveAspectRatio="xMidYMid slice"/>

    <!-- Privacy masks cover only the small task-title bands on Agent keys. -->
    <g fill="#0B0E14" opacity=".97">
      <rect x="418" y="270" width="86" height="21" rx="6"/>
      <rect x="548" y="294" width="90" height="21" rx="6"/>
      <rect x="691" y="318" width="96" height="22" rx="6"/>
      <rect x="844" y="342" width="100" height="23" rx="6"/>
      <rect x="392" y="365" width="94" height="22" rx="6"/>
      <rect x="530" y="392" width="100" height="22" rx="6"/>
    </g>
  </g>

  <rect x="1260" width="660" height="960" fill="url(#panel-glow)"/>
  <rect x="1260" width="8" height="960" fill="#304FFE"/>
  <circle cx="1840" cy="110" r="260" fill="#304FFE" opacity=".12"/>
  <circle cx="1310" cy="900" r="260" fill="#00FF4C" opacity=".06"/>

  <g font-family="Arial, Helvetica, sans-serif">
    <text x="1340" y="210" fill="#FFFFFF" font-size="68" font-weight="700">Real hardware.</text>
    <text x="1340" y="295" fill="#FFFFFF" font-size="68" font-weight="700">Real local</text>
    <text x="1340" y="380" fill="#FFFFFF" font-size="68" font-weight="700">workflow.</text>

    <text x="1344" y="500" fill="#FFFFFF" font-size="38" font-weight="700">Codex Shortcuts Plugin</text>
    <text x="1344" y="560" fill="#AAB4C8" font-size="30">Stream Deck + on macOS</text>

    <rect x="1340" y="630" width="476" height="116" rx="28" fill="#172033" stroke="#304FFE" stroke-width="3"/>
    <circle cx="1390" cy="688" r="14" fill="#00FF4C"/>
    <text x="1425" y="681" fill="#FFFFFF" font-size="24" font-weight="700">Photo captured with</text>
    <text x="1425" y="717" fill="#FFFFFF" font-size="24" font-weight="700">the plugin running</text>

    <text x="1344" y="840" fill="#FFFFFF" font-size="30" font-weight="700">KAWAII</text>
    <text x="1344" y="884" fill="#77839A" font-size="22">Independent third-party plugin</text>
  </g>
</svg>
